[project]
name = "pulseai"
version = "0.1.0"
description = "PulseAI backend — ticket/issue triage and weekly summarization API"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "python-multipart>=0.0.12",
    "sqlalchemy>=2.0.35",
    "alembic>=1.13",
    "psycopg[binary]>=3.2",
    "pgvector>=0.3.6",
    "redis>=5.2",
    "pydantic>=2.9",
    "pydantic-settings>=2.6",
    # ---- Phase 1: ingestion ----
    "pandas>=2.2",
    "pdfplumber>=0.11",
    "langdetect>=1.0.9",
    "charset-normalizer>=3.4",
    # ---- Phase 2: AI pipeline ----
    "openai>=1.60",
    # ---- Phase 5: auth (Google/Apple OIDC) ----
    "authlib>=1.3",
    "pyjwt[crypto]>=2.9",
    "itsdangerous>=2.2",
    "httpx>=0.27",
]

[project.optional-dependencies]
dev = [
    "ruff>=0.7",
    "mypy>=1.13",
    "pytest>=8.3",
    "httpx>=0.27",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/app"]

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "N", "UP", "B", "C4", "SIM", "TID"]
ignore = ["B008"]  # FastAPI Depends() in defaults is idiomatic

[tool.ruff.lint.isort]
known-first-party = ["app"]

[tool.mypy]
# Matches the runtime env (3.12); numpy's bundled stubs use 3.12 `type` syntax.
python_version = "3.12"
plugins = ["pydantic.mypy"]
mypy_path = "src"
packages = ["app"]
strict = true
warn_unused_ignores = true
disallow_untyped_defs = true
no_implicit_optional = true

[[tool.mypy.overrides]]
module = ["pgvector.*", "pdfplumber.*", "langdetect.*", "authlib.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
addopts = "-ra -q"
filterwarnings = ["error::DeprecationWarning:app.*"]
