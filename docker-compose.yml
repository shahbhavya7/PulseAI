# Full PulseAI stack: the app (FastAPI API + Next.js dashboard in one image),
# PostgreSQL (with pgvector), and Redis. Credentials come from .env (see
# .env.example); nothing is hardcoded here beyond local-dev defaults .env overrides.
#
#   docker compose up            # build + run everything
#   PULSE_IMAGE=ghcr.io/shahbhavya7/pulseai:latest docker compose up   # skip the build

services:
  app:
    # Build locally by default; set PULSE_IMAGE to pull a prebuilt image instead.
    image: ${PULSE_IMAGE:-pulseai:local}
    build:
      context: .
      dockerfile: Dockerfile
    container_name: pulse-app
    env_file:
      - .env
    environment:
      # Inside the compose network the DB/Redis are reachable by service name.
      PULSE_POSTGRES_HOST: postgres
      PULSE_POSTGRES_PORT: "5432"
      PULSE_REDIS_URL: redis://redis:6379/0
    ports:
      - "${PULSE_FRONTEND_PORT:-3000}:3000"   # dashboard
      - "${PULSE_API_PORT:-8000}:8000"        # API
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    restart: unless-stopped

  postgres:
    image: pgvector/pgvector:pg16
    container_name: pulse-postgres
    environment:
      POSTGRES_USER: ${PULSE_POSTGRES_USER:-pulse}
      POSTGRES_PASSWORD: ${PULSE_POSTGRES_PASSWORD:-pulse}
      POSTGRES_DB: ${PULSE_POSTGRES_DB:-pulse}
    ports:
      - "${PULSE_POSTGRES_PORT:-5432}:5432"
    volumes:
      - pulse_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${PULSE_POSTGRES_USER:-pulse} -d ${PULSE_POSTGRES_DB:-pulse}"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    container_name: pulse-redis
    ports:
      - "6379:6379"
    volumes:
      - pulse_redisdata:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  pulse_pgdata:
  pulse_redisdata:
